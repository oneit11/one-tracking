{% extends "base.html" %}
{% block title %}جدول صيانة وقائية{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">جدول صيانة وقائية جديد</h1>
    <a href="{{ url_for('pm.schedules_list') }}" class="btn btn-secondary">← رجوع</a>
</div>
<div class="card">
    <form method="post">
        <div class="form-grid">
            <div class="form-group full"><label class="form-label">اسم الجدول *</label><input class="form-input" name="name" required placeholder="مثال: صيانة كاميرات ربع سنوية"></div>
            <div class="form-group">
                <label class="form-label">العميل *</label>
                <select class="form-select" name="client_id" required>
                    <option value="">--</option>
                    {% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">الأولوية</label>
                <select class="form-select" name="priority">
                    <option value="low">منخفض</option><option value="normal" selected>عادي</option>
                    <option value="high">عالي</option><option value="urgent">عاجل</option>
                </select>
            </div>
            <div class="form-group"><label class="form-label">كل كام يوم *</label><input class="form-input" type="number" name="interval_days" required value="90"></div>
            <div class="form-group"><label class="form-label">أول موعد للتوليد</label><input class="form-input" type="date" name="first_run"></div>
            <div class="form-group full"><label class="form-label">الوصف</label><textarea class="form-textarea" name="description" placeholder="اذكر تفاصيل نوع الصيانة المطلوبة..."></textarea></div>
        </div>
        <div class="form-actions"><button class="btn btn-primary">💾 حفظ</button></div>
    </form>
</div>
{% endblock %}
