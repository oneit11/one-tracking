{% extends "base.html" %}
{% block title %}الهوية والشكل{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">🎨 الهوية والشكل</h1>
    <a href="{{ url_for('settings.home') }}" class="btn btn-secondary">← الإعدادات</a>
</div>

<div class="card">
    <form method="post" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">اسم البرنامج <span class="req">*</span></label>
                <input class="form-input" name="app_name" required value="{{ s.get('app_name', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label">الاسم المختصر (للتثبيت)</label>
                <input class="form-input" name="app_short_name" value="{{ s.get('app_short_name', '') }}">
                <span class="form-hint">يظهر تحت الأيقونة على شاشة الموبايل</span>
            </div>
            <div class="form-group">
                <label class="form-label">اللون الأساسي</label>
                <input class="form-input" type="color" name="primary_color" value="{{ s.get('primary_color', '#0b3d91') }}">
            </div>
            <div class="form-group">
                <label class="form-label">اللون الثانوي</label>
                <input class="form-input" type="color" name="accent_color" value="{{ s.get('accent_color', '#14b8a6') }}">
            </div>
            <div class="form-group full">
                <label class="form-label">لوجو الشركة</label>
                <input class="form-input" type="file" name="logo" accept="image/*">
                {% if s.get('logo_url') %}
                    <img src="{{ s.get('logo_url') }}" class="image-thumb mt-2" style="max-height:100px">
                {% endif %}
                <span class="form-hint">مقاس مفضل: 200×200 مربع، PNG بخلفية شفافة</span>
            </div>
            <div class="form-group full">
                <label class="form-label">Favicon (اختياري)</label>
                <input class="form-input" type="file" name="favicon" accept="image/*">
                {% if s.get('favicon_url') %}
                    <img src="{{ s.get('favicon_url') }}" class="image-thumb mt-2" style="max-height:40px">
                {% endif %}
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary">💾 حفظ</button>
        </div>
    </form>
</div>
{% endblock %}
