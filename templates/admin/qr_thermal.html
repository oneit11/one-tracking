<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة حرارية — {{ batch.batch_code }}</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f0f0;
            text-align: center;
        }
        .toolbar {
            padding: 16px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .toolbar button {
            font-size: 16px;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #1a1d24;
            color: #d4af37;
            cursor: pointer;
            font-weight: 700;
        }
        .toolbar a { display:inline-block; margin-inline-start:10px; color:#555; text-decoration:none; }
        .toolbar .count { color:#888; font-size:14px; display:block; margin-top:6px; }

        /* Label physical size: 25mm wide x 35mm tall */
        .sheet { padding: 20px 0; }
        .label {
            width: 25mm;
            height: 35mm;
            background: #fff;
            margin: 8px auto;
            box-sizing: border-box;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            page-break-after: always;
            break-after: page;
            overflow: hidden;
        }
        /* QR fills most of the width; code sits underneath */
        .label img { width: 22mm; height: 22mm; display: block; }
        .label .code { font-size: 6px; color: #000; margin-top: 0.5mm; direction: ltr; letter-spacing: .2px; line-height: 1; }

        @media print {
            .toolbar { display: none; }
            body { background: #fff; }
            .sheet { padding: 0; }
            .label { box-shadow: none; margin: 0 auto; }
            @page { size: 25mm 35mm; margin: 0; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button onclick="window.print()">🖨️ طباعة {{ codes|length }} ملصق</button>
        <a href="{{ url_for('admin.qr_batch_view', bid=batch.id) }}">← رجوع</a>
        <span class="count">باتش {{ batch.batch_code }} — {{ codes|length }} كود · مقاس الملصق 25×35mm</span>
    </div>

    <div class="sheet">
        {% for qr in codes %}
        <div class="label">
            <img src="{{ url_for('admin.qr_code_png', code=qr.code) }}" alt="QR" loading="eager">
            <div class="code">{{ qr.code }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
