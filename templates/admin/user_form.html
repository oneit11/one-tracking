{% extends "base.html" %}
{% block title %}{{ 'تعديل' if user else 'مستخدم جديد' }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">{{ 'تعديل: ' ~ user.name if user else 'مستخدم جديد' }}</h1>
    <a href="{{ url_for('admin.users_list') }}" class="btn btn-secondary">← رجوع</a>
</div>

<div class="card">
    <form method="post">
        <div class="form-grid">
            <div class="form-group"><label class="form-label">الاسم *</label><input class="form-input" name="name" required value="{{ user.name if user else '' }}"></div>
            {% if not user %}
            <div class="form-group"><label class="form-label">البريد الإلكتروني *</label><input class="form-input" type="email" name="email" required dir="ltr"></div>
            {% endif %}
            <div class="form-group">
                <label class="form-label">التليفون (WhatsApp)</label>
                <input class="form-input" name="phone" dir="ltr" value="{{ user.phone if user else '' }}">
                <span class="form-hint">لإرسال بيانات الدخول والإشعارات</span>
            </div>
            <div class="form-group">
                <label class="form-label">الدور *</label>
                <select class="form-select" name="role_code" required id="role_select">
                    {% for r in roles %}
                    <option value="{{ r.code }}" {% if user and (user.role_code == r.code or user.role == r.code) %}selected{% endif %}>
                        {{ r.name }} {% if r.is_system %}(نظام){% endif %}
                    </option>
                    {% endfor %}
                </select>
                <span class="form-hint">
                    <a href="{{ url_for('settings.roles_list') }}">إدارة الأدوار</a>
                </span>
            </div>
            <div class="form-group" id="client_group">
                <label class="form-label">اربط بعميل (لدور "عميل")</label>
                <select class="form-select" name="client_id">
                    <option value="">--</option>
                    {% for c in clients %}
                    <option value="{{ c.id }}" {% if user and user.client_id == c.id %}selected{% endif %}>{{ c.company_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'كلمة مرور جديدة' if user else 'كلمة المرور *' }}</label>
                <input class="form-input" type="password" name="password" {% if not user %}required{% endif %}
                       placeholder="{{ 'اتركه فاضي لعدم التغيير' if user else '' }}">
            </div>
            <div class="form-group">
                <label style="display:flex;gap:8px;align-items:center">
                    <input type="checkbox" name="send_credentials" checked>
                    إرسال بيانات الدخول عبر WhatsApp
                </label>
            </div>
            {% if user %}
            <div class="form-group">
                <label style="display:flex;gap:8px;align-items:center">
                    <input type="checkbox" name="active" {% if user.active %}checked{% endif %}>
                    نشط
                </label>
            </div>
            {% endif %}
        </div>
        <div class="form-actions"><button class="btn btn-primary">💾 حفظ</button></div>
    </form>
</div>
{% endblock %}
