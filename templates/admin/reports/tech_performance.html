{% extends "base.html" %}
{% block title %}أداء الفنيين{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1 class="page-title">👨‍🔧 أداء الفنيين</h1><p class="page-subtitle">من {{ frm }} إلى {{ to }}</p></div>
    <div class="d-flex gap-2">
        <a href="{{ url_for('reports.tech_performance_pdf', **{'from': frm, 'to': to}) }}" class="btn btn-primary">📄 PDF</a>
        <a href="{{ url_for('reports.home') }}" class="btn btn-secondary">← رجوع</a>
    </div>
</div>
<div class="card">
    <form method="get" class="d-flex gap-2 mb-4 flex-wrap">
        <div class="form-group"><label class="form-label">من</label><input class="form-input" type="date" name="from" value="{{ frm }}"></div>
        <div class="form-group"><label class="form-label">إلى</label><input class="form-input" type="date" name="to" value="{{ to }}"></div>
        <button class="btn btn-primary" style="align-self:end">تحديث</button>
    </form>
    <div class="table-wrap">
        <table class="table">
            <thead><tr><th>الفني</th><th>المسندة</th><th>المغلقة</th><th>معدل الإنجاز</th></tr></thead>
            <tbody>
                {% for r in rows %}
                <tr>
                    <td><strong>{{ r.name }}</strong></td>
                    <td>{{ r.assigned }}</td>
                    <td>{{ r.closed }}</td>
                    <td>{{ r.rate }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
